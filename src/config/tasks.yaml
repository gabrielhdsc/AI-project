# Instruções específicas para cada tarefa. Os campos entre chaves são preenchidos em tempo de execução.

task_classifier:
  description: >
    Histórico da conversa: {history}
    Nova mensagem do cliente: "{message}"

    Descubra o que o cliente precisa.
    1. Se ele só cumprimentou, cumprimente e pergunte como pode ajudar.
    2. Se demonstrar intenção de comprar ou agendar, direcione para "sales".
    3. Se tiver dúvida sobre horário, entrega, troca ou reclamação, direcione para "support".
    4. Se for agressivo ou pedir um atendente humano, direcione para "human".
  expected_output: >
    Retorne APENAS um objeto JSON válido, sem Markdown:
    {{
      "msg_to_client": "resposta curta ao cliente, ou vazia quando houver encaminhamento",
      "next_agent": "sales"
    }}
    Valores aceitos para "next_agent": "classifier", "sales", "support" e "human".

task_sales:
  description: >
    Histórico da conversa: {history}
    Mensagem recebida no WhatsApp: "{message}"

    Com base no contexto, responda de forma curta e conduza a conversa para a compra ou o agendamento.
    Se a pergunta envolver produtos, serviços, preços ou disponibilidade, use a ferramenta de catálogo antes de responder.
    Para exploração, seja leve e informativo; para decisão, seja objetivo; para insegurança, seja acolhedor e explicativo.
  expected_output: >
    Retorne APENAS um objeto JSON válido, sem Markdown:
    {{
      "mensagem": "mensagem curta, natural e com CTA quando apropriado",
      "transferir_para": null
    }}
    Valores aceitos para "transferir_para": null, "sales", "support", "post_sales" e "human".

task_follow_up:
  description: >
    O cliente parou de responder há 24 horas.
    Histórico da conversa: {history}
    Gere uma mensagem que continue o assunto da última interação.
  expected_output: >
    Uma mensagem curta, de no máximo duas linhas, amigável, com uma pergunta simples para reengajar.
    Use urgência leve e não recomece a conversa do zero.

task_support:
  description: >
    Informações da loja: {info_store}
    Histórico da conversa: {history}
    Mensagem do cliente: "{message}"

    Resolva dúvidas operacionais com clareza e empatia. Não tente vender produtos.
    Para reclamações graves ou assuntos fora do seu conhecimento, encaminhe para um humano.
  expected_output: >
    Retorne APENAS um objeto JSON válido, sem Markdown:
    {{
      "mensagem": "resposta prestativa, ou vazia se houver encaminhamento",
      "transferir_para": null
    }}
    Valores aceitos para "transferir_para": null, "sales", "post_sales" e "human".

task_post_sales:
  description: >
    Uma venda ou serviço foi concluído recentemente.
    Histórico da conversa: {history}
    Faça um acompanhamento carinhoso para verificar a satisfação e termine com uma pergunta leve.
    Se houver interesse em nova compra, preço ou agendamento, encaminhe para "sales".
    Para problema, insatisfação, alergia ou dúvida operacional complexa, encaminhe para "support".
  expected_output: >
    Retorne APENAS um objeto JSON válido, sem Markdown:
    {{
      "mensagem": "mensagem de pós-venda, ou vazia se houver encaminhamento",
      "transferir_para": null
    }}
    Valores aceitos para "transferir_para": null, "sales" e "support".
